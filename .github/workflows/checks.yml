name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, for which setup-python has no
    # Python 3.9 build. 3.9 is still the oldest version the tools support.
    runs-on: ubuntu-24.04
    strategy:
      # One version failing must not hide the result of the other.
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: python -m unittest -q
      - run: node --test tests/browser.test.cjs
      # A few seconds on the committed slice of real prices: every strategy,
      # the old pipeline and the shipped policy, end to end.
      - run: python -m backtest smoke
      - run: python -m compileall -q -x '/\.venv/' .
